name: Verify Actions Access

on:
  push:
    branches: [test/verify-actions]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Report context
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          echo "actor=$GITHUB_ACTOR"
          echo "ref=$GITHUB_REF"
          echo "runner.os=$RUNNER_OS runner.arch=$RUNNER_ARCH"
      - name: Success marker
        run: echo "✅ Actions verification PASSED on runner: $RUNNER_NAME"
