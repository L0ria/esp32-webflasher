name: Tests

# Test pipeline for esp32-webflasher (issue #26 §6/§8).
#
# This file is the single home for the whole suite and grows as the phased PRs
# land:
#   * PR 1 (this)  -> `backend-unit`   (pytest, Flask test client)
#   * PR 2         -> `frontend-unit`  (vitest + jsdom)
#   * PR 3         -> `api-integration` (pytest + requests, real server)
#   * PR 4 (this)  -> `browser-integration` (Playwright + stub serial)
#   * PR 5         -> `docker-acceptance` (manual / dind tier)
#
# Triggers:
#   * every pull request (the primary "run tests for each PR" requirement);
#   * pushes to main (keeps main green);
#   * manual dispatch (ad-hoc runs).
#
# NOTE on the quoted "on" key: bare `on` is parsed as the boolean `true` under
# YAML 1.1, so it must be quoted (see the earlier test/verify-actions fix).
"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the jobs only read the repository contents.
permissions:
  contents: read

# Don't pile up stale runs when a PR gets new commits.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          # requirements.txt (runtime) + requirements-dev.txt (pytest) are both
          # committed, so pip's cache key can hash them.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend unit tests
        run: pytest tests/unit

  frontend-unit:
    name: Frontend unit (vitest + jsdom)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          # package-lock.json is committed, so npm's cache key can hash it.
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npx vitest run

  api-integration:
    name: API integration (pytest, real server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run API integration tests
        run: pytest tests/integration

  browser-integration:
    name: Browser integration (Playwright + stub serial)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          # package-lock.json is committed, so npm's cache key can hash it.
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # The browser suite drives the REAL app.py server (tests/e2e/fixtures.js
      # spawns it), so the runtime deps must be importable — install them for
      # the default python3 (the fixture's fallback interpreter).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser integration tests
        run: npx playwright test

  docker-acceptance:
    name: Docker acceptance (compose + scripted spec §10 checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ubuntu-latest ships a native Docker daemon (no dind service needed).
      # The script owns the compose lifecycle: up --build -> checks -> down -v.
      - name: Run docker acceptance (spec §10)
        run: bash scripts/docker-acceptance.sh
