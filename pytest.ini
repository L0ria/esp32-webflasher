[pytest]
# Backend suites (issue #26).  Two layers, run explicitly:
#   * unit         — pytest tests/unit        (PR 1, Flask test client)
#   * integration  — pytest tests/integration (PR 3, real app.py server over HTTP)
# `testpaths` keeps the bare `pytest` invocation on the unit suite (the default
# fast loop); the integration suite is always invoked by its explicit path.
testpaths = tests/unit
addopts = -ra --strict-markers
